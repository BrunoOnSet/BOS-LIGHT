<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" id="themeColor" content="#F3F1EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BOS LIGHT" />
  <title>BOS — LIGHT</title>
  <link rel="manifest" href="manifest.webmanifest?v=2.0.0" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.0.0" />
  <link rel="stylesheet" href="continuous.css?v=2.0.1" />
  <style>
    .project-sheet-inner{padding:16px}
    .project-actions{margin-top:10px}
    @media(max-width:520px){.project-sheet-inner{padding:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="install-app-row" id="installAppRow" hidden aria-label="Installer LIGHT">
      <button class="install-app-btn" id="installAppBtn" type="button">INSTALLER L’APPLICATION <span aria-hidden="true">→</span></button>
    </section>

    <header class="topbar cardlike">
      <div class="top-inner bos-top-inner">
        <div class="bos-brand-lockup" aria-label="Bruno OnSet LIGHT">
          <img class="bos-header-logo" src="assets/logo-bos-header.jpg" alt="Logo Bruno OnSet">
          <div class="bos-brand-text">
            <span class="bos-header-name">Bruno OnSet<span class="bos-header-app">- LIGHT</span></span>
            <span class="bos-header-tagline">Avec vous, sur chaque tournage.</span>
          </div>
        </div>
        <div class="top-actions bos-top-actions">
          <button class="mode-btn" id="themeBtn" aria-label="Changer de thème" title="Thème">DARK</button>
        </div>
      </div>
    </header>

    <section class="project-contact project-contact-top" aria-label="Contact professionnel">
      <button class="project-contact-btn" id="projectContactBtn" type="button">Parler de votre tournage <span aria-hidden="true">→</span></button>
    </section>

    <div class="mode-switch light-section-switch" role="group" aria-label="Type de contenu LIGHT">
      <button class="mode-choice active" id="applicationsModeBtn" type="button" aria-pressed="true">APPLICATIONS</button>
      <button class="mode-choice" id="technicalModeBtn" type="button" aria-pressed="false">FICHES TECHNIQUES</button>
    </div>

    <section class="continuous-tools light-only-tools" aria-label="LIGHT">
      <iframe class="tool-frame" id="lightFrame" title="LIGHT" src="modules/light/?embed=1&v=2.0.0" scrolling="no"></iframe>
    </section>

    <div class="feedback-contact">
      <a class="feedback-contact-link" href="mailto:brunoguillardcontact@gmail.com?subject=Suggestion%20%E2%80%94%20BOS%20LIGHT&body=Bonjour%20Bruno%2C%0A%0AJ%E2%80%99ai%20une%20id%C3%A9e%20pour%20am%C3%A9liorer%20BOS%20LIGHT%20%3A%0A%0A">Une idée pour améliorer l’application ? <span aria-hidden="true">→</span></a>
    </div>
    <footer class="footer">BOS — Bruno OnSet · LIGHT · V2.0</footer>
  </main>

  <dialog id="installDialog" class="sheet install-sheet">
    <form method="dialog" class="sheet-inner install-sheet-inner">
      <div class="sheet-head"><div><strong>Installer LIGHT</strong><small id="installHelpText">Ajoutez l’application à votre écran d’accueil.</small></div><button value="close" class="iconbtn" aria-label="Fermer">×</button></div>
      <div class="install-help" id="installHelpBody"></div>
      <div class="sheet-actions"><button value="close" class="primary">Compris</button></div>
    </form>
  </dialog>

  <dialog id="projectDialog" class="sheet project-sheet">
    <form method="dialog" class="sheet-inner project-sheet-inner">
      <div class="project-sheet-head"><div><span class="project-kicker">BRUNO ONSET</span></div><button class="project-close" value="close" aria-label="Fermer">×</button></div>
      <div class="project-actions">
        <a class="project-email-btn" href="mailto:brunoguillardcontact@gmail.com?subject=Projet%20de%20tournage%20%E2%80%94%20Bruno%20OnSet&body=Bonjour%20Bruno%2C%0A%0AJe%20vous%20contacte%20depuis%20Bruno%20OnSet.%0A%0A">Écrire à Bruno <span aria-hidden="true">→</span></a>
        <div class="project-secondary-links"><a class="project-secondary-link" href="https://wa.me/33679979111?text=Bonjour%20Bruno%2C%0A%0AJe%20vous%20contacte%20depuis%20Bruno%20OnSet.%0A%0A" target="_blank" rel="noopener noreferrer">WhatsApp</a><span aria-hidden="true">·</span><a class="project-secondary-link" href="https://brunoguillard.com" target="_blank" rel="noopener noreferrer">BrunoGuillard.com</a></div>
      </div>
    </form>
  </dialog>

  <script src="light-host.js?v=2.0.5"></script>
  <script src="light-falloff-bridge.js?v=1.0.4"></script>
  <script src="light-shadow-images.js?v=1.0.1"></script>
  <script src="light-height-authority.js?v=1.0.2"></script>
  <script src="light-mobile-falloff-guard.js?v=1.0.0"></script>
</body>
</html>
